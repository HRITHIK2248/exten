<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  >

  <title>Payment QR Tool Settings</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      max-width: 560px;
      margin: 0 auto;
      padding: 24px;
      color: #101828;
      background: #f8fafc;
      font-family: Arial, sans-serif;
    }

    h1 {
      margin: 0 0 8px;
      font-size: 22px;
    }

    h2 {
      margin: 28px 0 10px;
      font-size: 17px;
    }

    .description {
      margin: 0 0 22px;
      color: #667085;
      font-size: 13px;
    }

    .setting {
      margin-bottom: 15px;
      padding: 14px;
      background: #ffffff;
      border: 1px solid #d0d5dd;
      border-radius: 8px;
    }

    label {
      display: block;
      margin-bottom: 7px;
      color: #344054;
      font-size: 14px;
      font-weight: 700;
    }

    .help {
      margin: 0 0 8px;
      color: #667085;
      font-size: 12px;
    }

    input,
    select {
      width: 100%;
      padding: 9px;
      border: 1px solid #98a2b3;
      border-radius: 6px;
      font-size: 14px;
    }

    button {
      padding: 10px 18px;
      color: #ffffff;
      background: #175cd3;
      border: 0;
      border-radius: 7px;
      cursor: pointer;
      font-size: 14px;
      font-weight: 700;
    }

    button:hover {
      background: #1849a9;
    }

    #status {
      display: inline-block;
      margin-left: 12px;
      color: #087f5b;
      font-size: 13px;
    }

    #previewCanvas {
      display: block;
      width: 100%;
      height: auto;
      background: #ffffff;
      border: 1px solid #d0d5dd;
      border-radius: 8px;
    }
  </style>
</head>

<body>
  <h1>Payment QR Tool Settings</h1>

  <p class="description">
    Adjust the highlighted screenshot border and arrow.
  </p>

  <div class="setting">
    <label for="borderSpacing">
      Border spacing
    </label>

    <p class="help">
      Space between QR and border, in pixels.
    </p>

    <input
      id="borderSpacing"
      type="number"
      min="1"
      max="100"
      step="1"
    >
  </div>

  <div class="setting">
    <label for="borderThickness">
      Border thickness
    </label>

    <p class="help">
      Thickness of the red border, in pixels.
    </p>

    <input
      id="borderThickness"
      type="number"
      min="1"
      max="30"
      step="1"
    >
  </div>

  <div class="setting">
    <label for="arrowSize">
      Arrow size
    </label>

    <p class="help">
      Relative arrow length. Use a value between 0.03 and 0.30.
    </p>

    <input
      id="arrowSize"
      type="number"
      min="0.03"
      max="0.30"
      step="0.01"
    >
  </div>

  <div class="setting">
    <label for="arrowDirection">
      Arrow side
    </label>

    <p class="help">
      Automatic selects the side with the best available space.
    </p>

    <select id="arrowDirection">
      <option value="auto">
        Automatic
      </option>

      <option value="left">
        Left side of QR
      </option>

      <option value="right">
        Right side of QR
      </option>
    </select>
  </div>

  <button
    id="saveButton"
    type="button"
  >
    Save settings
  </button>

  <span id="status"></span>

  <h2>Live preview</h2>

  <canvas
    id="previewCanvas"
    width="420"
    height="260"
  ></canvas>

  <script src="options.js"></script>
</body>
</html>
